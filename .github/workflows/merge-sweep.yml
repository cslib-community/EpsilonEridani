name: Merge sweep

# Re-drive green PRs that the merge queue evicted, so an eviction is never terminal. auto-merge.yml
# enqueues a green PR once per triggering event (a push, a /review comment, or a fresh pr-build); if the
# merge queue then evicts it — a merge group that could not form, or a rebuild against a moved main that
# failed — nothing re-drives an otherwise-idle green PR and it strands: green on every rubric, never
# merged. housekeeping.yml only CLOSES PRs (and only blocking ones), so a wedged-but-green PR is closed
# by nothing. This scheduled sweep re-enqueues such PRs (reusing the existing head-pinned review — no
# re-review, no API spend), and for a head the queue has repeatedly rejected, updates the branch onto
# main or hands a fork/conflict to its tending worker. It calls the lightweight TauCetiReview merge-sweep workflow, which mints no
# provider keys and runs no reviewer; the merge decision is the same one auto-merge uses, so the sweep
# can never merge something the normal gate would refuse.
# queue-release.yml also dispatches this workflow when a Lake-pin reservation ends,
# so waiting PRs need not wait for the scheduled backstop after a bump departs.

on:
  schedule:
    - cron: "40 * * * *"   # hourly, offset from housekeeping (:20) and the daily bump
  repository_dispatch:
    types: [tauceti-merge-reconcile]
  workflow_dispatch:
    inputs:
      dry-run:
        description: "List actions without enqueuing / updating / flagging"
        type: boolean
        default: false
      full-scan:
        description: "Inspect all open PRs (bounded by the API budget); normally handled hourly"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: merge-sweep
  cancel-in-progress: false

jobs:
  app-credentials:
    runs-on: ubuntu-latest
    permissions: {}
    outputs:
      ready: ${{ steps.check.outputs.ready }}
    steps:
      - name: Check App settings for setup
        id: check
        env:
          APP_ID: ${{ secrets.APP_ID }}
          APP_PRIVATE_KEY: ${{ secrets.APP_PRIVATE_KEY }}
        shell: bash
        run: |
          ready=true
          for name in APP_ID APP_PRIVATE_KEY; do
            if [ -z "${!name}" ]; then
              ready=false
              printf 'Missing %s. Finish App credential setup with tauceti-tools doctor.\n' "$name" >> "$GITHUB_STEP_SUMMARY"
            fi
          done
          printf 'ready=%s\n' "$ready" >> "$GITHUB_OUTPUT"

  sweep:
    if: needs.app-credentials.outputs.ready == 'true'
    needs: app-credentials
    # Pinned to a TauCetiReview commit; bump deliberately. The reusable workflow receives the App
    # secrets, so a floating @main would be a supply-chain risk.
    # Re-pin together with the other two callers and .github/actions/checkout-merge-policy
    # (scripts/test_workflow_pins.py checks they agree). Pass the same pin to the runner checkout.
    uses: TauCetiProject/TauCetiReview/.github/workflows/merge-sweep.yml@fc9a57c67bf375ff349abc15c91f7fdb3ad2d486
    with:
      review_ref: fc9a57c67bf375ff349abc15c91f7fdb3ad2d486
      tools_repository: TauCetiProject/TauCetiTools
      tools_ref: 45fa5b01ac0a81df7250147d5e7b6cbe252524fe
      dry_run: ${{ inputs.dry-run || false }}
      focused: ${{ github.event_name == 'repository_dispatch' || (github.event_name == 'workflow_dispatch' && !inputs.full-scan) }}
    secrets:
      APP_ID: ${{ secrets.APP_ID }}
      APP_PRIVATE_KEY: ${{ secrets.APP_PRIVATE_KEY }}
