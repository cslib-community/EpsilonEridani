name: Retry CI status publication

# Replay retained terminal statuses only; never rerun the source build.
on:
  workflow_run:
    workflows: [pr-build]
    types: [completed]

permissions:
  contents: read
  actions: read
  pull-requests: read
  statuses: write

jobs:
  publish:
    uses: TauCetiProject/TauCetiTools/.github/workflows/retry-ci-status.yml@4b554aae4441ade012eaa869b2d0f4eae79176a5
    with:
      tools_repository: TauCetiProject/TauCetiTools
      tools_ref: 4b554aae4441ade012eaa869b2d0f4eae79176a5
      project_ref: ${{ github.workflow_sha }}
    secrets:
      CI_READ_APP_ID: ${{ secrets.CI_READ_APP_ID }}
      CI_READ_APP_PRIVATE_KEY: ${{ secrets.CI_READ_APP_PRIVATE_KEY }}
      CI_STATUS_APP_ID: ${{ secrets.CI_STATUS_APP_ID }}
      CI_STATUS_APP_PRIVATE_KEY: ${{ secrets.CI_STATUS_APP_PRIVATE_KEY }}
