name = "EpsilonEridani"
defaultTargets = ["EpsilonEridani"]
platformIndependent = true

[[require]]
name = "cslib"
git = "https://github.com/leanprover/cslib"
rev = "main"

[[lean_lib]]
name = "EpsilonEridani"
globs = ["EpsilonEridani.*"]
leanOptions = { weak.linter.mathlibStandardSet = true, warningAsError = true }

[[lean_exe]]
name = "axioms"
root = "scripts.Axioms"

[[lean_exe]]
name = "module-system"
root = "scripts.ModuleSystem"
